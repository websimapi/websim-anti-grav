<html><head><base href="https://anti-grav-racer-tunnel-improved.websim.dev/" />
<title>Anti Grav Racer - Tunnel Edition (Improved)</title>
<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }
  #gameCanvas {
    width: 100vw;
    height: 100vh;
  }
  #webcamPreview {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 200px;
    height: 150px;
    border: 2px solid #fff;
    border-radius: 10px;
    overflow: hidden;
  }
  #webcamVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #calibrateBtn {
    position: fixed;
    bottom: 20px;
    left: 20px;
    padding: 10px 20px;
    font-size: 16px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  #statusOverlay {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background-color: rgba(0, 0, 0, 0.7);
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 18px;
  }
  #speedometer {
    position: fixed;
    top: 20px;
    right: 20px;
    background-color: rgba(0, 0, 0, 0.7);
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 18px;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="webcamPreview">
  <video id="webcamVideo" playsinline></video>
</div>
<button id="calibrateBtn">Calibrate</button>
<div id="statusOverlay">Loading...</div>
<div id="speedometer">Speed: 0 km/h</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

<script>
let scene, camera, renderer, ship, tunnel, detector, video, calibrationData;
let isCalibrating = false;
const statusOverlay = document.getElementById('statusOverlay');
const calibrateBtn = document.getElementById('calibrateBtn');
const speedometer = document.getElementById('speedometer');

let shipVelocity = new THREE.Vector3();
const gravity = new THREE.Vector3(0, -0.005, 0);
const tunnelRadius = 5;
const tunnelLength = 1000;
const forwardSpeed = 0.2;

async function init() {
  // Set up Three.js scene
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas') });
  renderer.setSize(window.innerWidth, window.innerHeight);

  // Create ship
  const shipGeometry = new THREE.ConeGeometry(0.3, 1, 32);
  const shipMaterial = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
  ship = new THREE.Mesh(shipGeometry, shipMaterial);
  ship.rotation.x = Math.PI / 2; // Rotate ship to face forward
  ship.position.set(0, 0, -5);
  scene.add(ship);

  // Create tunnel
  const tunnelGeometry = new THREE.CylinderGeometry(tunnelRadius, tunnelRadius, tunnelLength, 32, 32, true);
  const tunnelMaterial = new THREE.MeshPhongMaterial({ color: 0xaaaaaa, side: THREE.BackSide, wireframe: true });
  tunnel = new THREE.Mesh(tunnelGeometry, tunnelMaterial);
  tunnel.rotation.x = Math.PI / 2;
  scene.add(tunnel);

  // Add lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambientLight);
  const pointLight = new THREE.PointLight(0xffffff, 1);
  pointLight.position.set(0, 0, 5);
  scene.add(pointLight);

  // Set up webcam
  video = document.getElementById('webcamVideo');
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  await new Promise(resolve => video.onloadedmetadata = resolve);
  video.play();

  // Load pose detection model
  const model = poseDetection.SupportedModels.MoveNet;
  detector = await poseDetection.createDetector(model, { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING });
  
  statusOverlay.textContent = "Ready! Lean left/right to steer, jump to accelerate, crouch to brake.";
  
  // Start game loop
  animate();
}

async function detectPose() {
  const poses = await detector.estimatePoses(video);
  return poses[0];
}

function updateShipPosition(pose) {
  if (!pose || !calibrationData) return;

  const leftShoulder = pose.keypoints.find(kp => kp.name === 'left_shoulder');
  const rightShoulder = pose.keypoints.find(kp => kp.name === 'right_shoulder');
  const leftHip = pose.keypoints.find(kp => kp.name === 'left_hip');
  const rightHip = pose.keypoints.find(kp => kp.name === 'right_hip');

  if (leftShoulder && rightShoulder && leftHip && rightHip) {
    // Calculate lean (steering)
    const shoulderMidpoint = (leftShoulder.x + rightShoulder.x) / 2;
    const leanAmount = (shoulderMidpoint - calibrationData.shoulderMidpoint) / 100;
    shipVelocity.x = leanAmount * 0.1;

    // Calculate jump/crouch (acceleration/braking)
    const currentHipY = (leftHip.y + rightHip.y) / 2;
    const verticalMovement = calibrationData.hipY - currentHipY;
    let verticalSpeed = 0;

    if (verticalMovement > 30) { // Jump threshold increased
      verticalSpeed = 0.1; // Accelerate
    } else if (verticalMovement < -10) { // Crouch
      verticalSpeed = -0.1; // Brake
    }

    shipVelocity.y += verticalSpeed;

    // Apply gravity
    shipVelocity.add(gravity);

    // Update ship position
    ship.position.add(shipVelocity);

    // Collision detection and correction
    const distanceFromCenter = Math.sqrt(ship.position.x ** 2 + ship.position.y ** 2);
    if (distanceFromCenter > tunnelRadius - 0.5) {
      const angle = Math.atan2(ship.position.y, ship.position.x);
      ship.position.x = (tunnelRadius - 0.5) * Math.cos(angle);
      ship.position.y = (tunnelRadius - 0.5) * Math.sin(angle);
      
      // Bounce effect
      shipVelocity.x *= -0.5;
      shipVelocity.y *= -0.5;
    }

    // Move ship forward at a constant speed
    ship.position.z -= forwardSpeed;

    // Update camera position to always be behind the character
    const cameraOffset = new THREE.Vector3(0, 1, 3); // Adjust these values to change camera position
    camera.position.copy(ship.position).add(cameraOffset);
    camera.lookAt(ship.position);

    // Reset tunnel position when ship reaches the end
    if (ship.position.z < -tunnelLength) {
      ship.position.z += tunnelLength;
      camera.position.z += tunnelLength;
    }

    // Update speedometer
    const speed = Math.sqrt(shipVelocity.x ** 2 + shipVelocity.y ** 2 + forwardSpeed ** 2) * 100;
    speedometer.textContent = `Speed: ${speed.toFixed(1)} km/h`;
  }
}

async function animate() {
  requestAnimationFrame(animate);

  if (!isCalibrating) {
    const pose = await detectPose();
    updateShipPosition(pose);
  }

  renderer.render(scene, camera);
}

async function calibrate() {
  isCalibrating = true;
  statusOverlay.textContent = "Calibrating... Stand straight and center yourself.";
  
  await new Promise(resolve => setTimeout(resolve, 3000));
  
  const pose = await detectPose();
  if (pose) {
    const leftShoulder = pose.keypoints.find(kp => kp.name === 'left_shoulder');
    const rightShoulder = pose.keypoints.find(kp => kp.name === 'right_shoulder');
    const leftHip = pose.keypoints.find(kp => kp.name === 'left_hip');
    const rightHip = pose.keypoints.find(kp => kp.name === 'right_hip');

    calibrationData = {
      shoulderMidpoint: (leftShoulder.x + rightShoulder.x) / 2,
      hipY: (leftHip.y + rightHip.y) / 2
    };
  }

  isCalibrating = false;
  statusOverlay.textContent = "Calibration complete! Let's race!";
}

calibrateBtn.addEventListener('click', calibrate);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
</script>

</body>
</html>
